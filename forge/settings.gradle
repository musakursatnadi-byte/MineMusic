// The Forge jars are a separate Gradle build, so ForgeGradle and Fabric Loom never share a classpath.
// Run it from the MineMusic folder with:  .\gradlew.bat -p forge collectJars
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

rootProject.name = 'MineMusic-Forge'

// Each Minecraft version is its own subproject under forge/versions/<mc>.
// They compile the same shared code as the Fabric jars (../src) plus the Forge entry point (../loader/forge).
def mcVersions = ['26.1.2', '26.2', '26.3']
mcVersions.each { mc ->
    def name = 'forge' + mc.replace('.', '_')
    include name
    project(":${name}").projectDir = file("versions/${mc}")
}
